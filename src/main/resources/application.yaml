
spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/testdb
    username: root
    password: yourpassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  sql:
    init:
      mode: always

  ai:
    vectorstore:
      pgvector:
        initialize-schema: true

    logging:
      level:
        org.springframework.ai.chat.client.advisor: DEBUG
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.2:3b
          temperature: 0.7
      embedding:
          options:
            model: all-minilm
server:
  port: 8080